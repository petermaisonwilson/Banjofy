name: Build Banjofy BeatNet Listening Laboratory 007

on:
  workflow_dispatch:
  push:
    branches:
      - song-analysis-lab

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
      - name: Install complete BeatNet runtime dependency set
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install setuptools==80.9.0 wheel==0.45.1
          python -m pip install numpy==1.23.5 scipy==1.10.1 Cython==0.29.36 mido==1.3.2
          python -m pip install madmom==0.16.1 --no-build-isolation
          python -c "import madmom; from madmom.features.beats import RNNBeatProcessor; print('madmom import passed')"
          python -m pip install librosa==0.10.1 soundfile==0.12.1 audioread==3.0.1
          python -m pip install pyaudio==0.2.14
          python -c "import pyaudio; print('PyAudio import passed')"
          python -m pip install torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install matplotlib==3.7.5 tensorboard==2.15.2 PyYAML==6.0.2 pytest==8.3.5
          python -m pip install "git+https://github.com/mjhydri/BeatNet.git" --no-deps
          python -c "from BeatNet.BeatNet import BeatNet; print('BeatNet import passed')"
      - name: Run real madmom and BeatNet offline audio proof
        shell: pwsh
        run: |
          python laboratories/beatnet_lab/offline_smoke_test.py
      - name: Run source release gate
        shell: pwsh
        run: |
          python laboratories/beatnet_lab/release_gate.py
      - name: Install packaging tools
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.11.1 imageio-ffmpeg==0.4.9
          python -c "import imageio_ffmpeg; print('imageio-ffmpeg import passed:', imageio_ffmpeg.get_ffmpeg_exe())"
          choco install ffmpeg -y --no-progress
      - name: Build Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm laboratories/beatnet_lab/beatnet_lab.spec
      - name: Launch packaged Windows application smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/BanjofyBeatNetLab007/BanjofyBeatNetLab007.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            throw "Packaged EXE exited unexpectedly with code $($proc.ExitCode)"
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host "Packaged EXE started successfully and remained running."

      - name: Assemble artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Recurse -Force "dist/BanjofyBeatNetLab007" "artifact/BanjofyBeatNetLab007"
          Copy-Item -Force "BEATNET_LAB_007_TEST.txt" "artifact/BEATNET_LAB_007_TEST.txt"
          Copy-Item -Force "laboratories/beatnet_lab/beatnet_offline_smoke_test.json" "artifact/beatnet_offline_smoke_test.json"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Banjofy-BeatNet-Listening-Laboratory-007-Windows
          path: artifact
          if-no-files-found: error
