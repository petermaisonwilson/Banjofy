name: Build Banjofy BeatNet Listening Laboratory 003

on:
  push:
    branches:
      - song-analysis-lab
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9.13"

      - name: Install BeatNet dependencies in required order
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<25" setuptools wheel
          python -m pip install numpy==1.23.5 scipy==1.10.1 librosa==0.10.1 soundfile==0.12.1 audioread==3.0.1
          python -m pip install torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pyaudio==0.2.14
          python -c "import pyaudio; print('PyAudio import passed')"
          python -m pip install "git+https://github.com/mjhydri/BeatNet.git" --no-deps
          python -c "from BeatNet.BeatNet import BeatNet; print('BeatNet import passed')"

      - name: Run real BeatNet offline smoke test
        shell: pwsh
        run: |
          python laboratories/beatnet_lab/offline_smoke_test.py

      - name: Verify BeatNet laboratory files
        shell: pwsh
        run: |
          $required = @(
            "laboratories/beatnet_lab/main.py",
            "laboratories/beatnet_lab/requirements.txt",
            "laboratories/beatnet_lab/beatnet_lab.spec",
            "laboratories/beatnet_lab/release_gate.py",
            "BEATNET_LAB_003_TEST.txt"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing BeatNet file: $file" }
          }

      - name: Install compatible scientific stack
        working-directory: laboratories/beatnet_lab
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<25" "setuptools==65.5.0" "wheel==0.41.3" "Cython==0.29.36"
          python -m pip install "numpy==1.23.5"
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Scientific dependency installation failed" }

      - name: Install madmom compatibility dependency
        working-directory: laboratories/beatnet_lab
        shell: pwsh
        run: |
          python -m pip install "madmom==0.16.1" --no-build-isolation
          if ($LASTEXITCODE -ne 0) { throw "madmom installation failed" }

      - name: Run source release gate
        working-directory: laboratories/beatnet_lab
        run: |
          python release_gate.py
          if ($LASTEXITCODE -ne 0) { throw "BeatNet source gate failed" }

      - name: Build portable Windows laboratory folder
        working-directory: laboratories/beatnet_lab
        run: |
          pyinstaller --clean --noconfirm beatnet_lab.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          if (-not (Test-Path "dist/BanjofyBeatNetLab003/BanjofyBeatNetLab003.exe")) { throw "Expected EXE missing" }

      - name: Finished EXE startup handshake
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE/laboratories/beatnet_lab/dist/BanjofyBeatNetLab003/BanjofyBeatNetLab003.exe"
          $probe = Join-Path $env:RUNNER_TEMP "banjofy-beatnet-ready.json"
          $env:BANJOFY_BEATNET_STARTUP_PROBE_FILE = $probe
          $process = Start-Process $exe -PassThru
          if (-not $process.WaitForExit(60000)) { throw "BeatNet EXE startup timed out" }
          if ($process.ExitCode -ne 0) { throw "BeatNet EXE exited $($process.ExitCode)" }
          if (-not (Test-Path $probe)) { throw "BeatNet READY marker missing" }
          $ready = Get-Content $probe -Raw | ConvertFrom-Json
          if ($ready.status -ne "ready") { throw "BeatNet EXE did not report ready" }

      - name: Assemble portable artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item "laboratories/beatnet_lab/dist/BanjofyBeatNetLab003" "artifact/BanjofyBeatNetLab003" -Recurse
          Copy-Item "BEATNET_LAB_003_TEST.txt" artifact/
          if (-not (Test-Path "artifact/BanjofyBeatNetLab003/BanjofyBeatNetLab003.exe")) { throw "Artifact EXE missing" }

      - name: Upload BeatNet listening laboratory
        uses: actions/upload-artifact@v4
        with:
          name: Banjofy-BeatNet-Listening-Laboratory-003-Windows
          path: artifact
          if-no-files-found: error
