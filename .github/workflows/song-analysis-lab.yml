name: Build Banjofy Song Analysis Laboratory 007

on:
  push:
    branches:
      - song-analysis-lab
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact Build 007 paths
        shell: pwsh
        run: |
          $required = @(
            ".github/workflows/song-analysis-lab.yml",
            "laboratories/song_analysis_lab/main.py",
            "laboratories/song_analysis_lab/structure_engine.py",
            "laboratories/song_analysis_lab/song_analysis_lab.spec",
            "laboratories/song_analysis_lab/release_gate.py",
            "laboratories/song_analysis_lab/requirements.txt",
            "SONG_ANALYSIS_LAB_007_TEST.txt"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing Build 007 file: $file" }
          }

      - name: Install pinned dependencies
        working-directory: laboratories/song_analysis_lab
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Pinned dependency installation failed" }

      - name: Run complete release gate
        working-directory: laboratories/song_analysis_lab
        run: |
          python release_gate.py
          if ($LASTEXITCODE -ne 0) { throw "Laboratory 007 complete release gate failed" }

      - name: Compile every Build 007 source
        working-directory: laboratories/song_analysis_lab
        run: |
          python -m py_compile main.py structure_engine.py release_gate.py
          if ($LASTEXITCODE -ne 0) { throw "Source compilation failed" }

      - name: Direct application-level 2-3-4 meter audio proofs
        shell: pwsh
        working-directory: laboratories/song_analysis_lab
        run: |
          @'
          import tempfile
          from pathlib import Path
          import librosa
          import numpy as np
          import soundfile as sf
          import structure_engine

          sr = 22050
          duration = 24.0
          length = int(sr * duration)
          beat_times = np.arange(0.5, duration, 0.5)

          def prove_meter(beats_per_bar, expected):
              ordinary = librosa.clicks(
                  times=beat_times, sr=sr, click_freq=1000.0,
                  click_duration=0.08, length=length,
              ).astype(np.float32)
              accent_times = beat_times[1::beats_per_bar]
              accented = 2.0 * librosa.clicks(
                  times=accent_times, sr=sr, click_freq=250.0,
                  click_duration=0.12, length=length,
              ).astype(np.float32)
              samples = ordinary + accented

              with tempfile.TemporaryDirectory() as temporary:
                  audio = Path(temporary) / f"proof_{beats_per_bar}_4.wav"
                  sf.write(audio, samples, sr)
                  result = structure_engine.analyse_structure(
                      audio,
                      [{"start_s": 0.0, "end_s": duration, "chord": "G"}],
                      print,
                  )
                  assert result.beat_count >= 40, result
                  assert result.meter == expected, result
                  assert result.beats_per_bar == beats_per_bar, result
                  assert result.bar_count >= 8, result
                  assert len(result.downbeat_times) == result.bar_count
                  assert result.bar_aligned_chords
                  print(f"Direct {expected} application proof passed")

          prove_meter(2, "2/4")
          prove_meter(3, "3/4")
          prove_meter(4, "4/4")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Direct 2/4, 3/4 and 4/4 audio proofs failed" }

      - name: Verify bundled FFmpeg
        working-directory: laboratories/song_analysis_lab
        run: |
          python -c "import imageio_ffmpeg, os; p=imageio_ffmpeg.get_ffmpeg_exe(); assert os.path.exists(p); print('FFmpeg available:', p)"

      - name: Build standalone Windows Laboratory 007
        working-directory: laboratories/song_analysis_lab
        run: |
          pyinstaller --clean --noconfirm song_analysis_lab.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          if (-not (Test-Path "dist/BanjofySongAnalysisLab007.exe")) { throw "Expected EXE was not produced" }

      - name: Finished EXE positive startup handshakes
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE/laboratories/song_analysis_lab/dist/BanjofySongAnalysisLab007.exe"
          $settingsFolder = Join-Path $env:LOCALAPPDATA "Banjofy\SongAnalysisLab"
          $settingsFile = Join-Path $settingsFolder "song_analysis_lab_settings.json"
          $probeFolder = Join-Path $env:RUNNER_TEMP "banjofy-sal007-probes"
          $existingLibrary = Join-Path $env:RUNNER_TEMP "banjofy-existing-library"
          New-Item -ItemType Directory -Force $probeFolder | Out-Null
          New-Item -ItemType Directory -Force $existingLibrary | Out-Null

          function Invoke-StartupProof {
            param([string]$Name, [string]$SettingsMode)

            Remove-Item $settingsFolder -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $settingsFolder | Out-Null

            if ($SettingsMode -eq "valid-existing") {
              $payload = @{ library_root = $existingLibrary } | ConvertTo-Json -Compress
              Set-Content -Path $settingsFile -Value $payload -Encoding UTF8
            }
            elseif ($SettingsMode -eq "valid-unavailable") {
              $payload = @{ library_root = "C:\Unavailable Banjofy Library" } | ConvertTo-Json -Compress
              Set-Content -Path $settingsFile -Value $payload -Encoding UTF8
            }
            elseif ($SettingsMode -eq "malformed") {
              Set-Content -Path $settingsFile -Value "{broken" -Encoding UTF8
            }
            elseif ($SettingsMode -eq "wrong-shape") {
              Set-Content -Path $settingsFile -Value '["wrong","shape"]' -Encoding UTF8
            }
            elseif ($SettingsMode -eq "missing") {
              Remove-Item $settingsFile -Force -ErrorAction SilentlyContinue
            }

            $probe = Join-Path $probeFolder "$Name.json"
            Remove-Item $probe -Force -ErrorAction SilentlyContinue
            $env:BANJOFY_STARTUP_PROBE_FILE = $probe

            $process = Start-Process -FilePath $exe -PassThru
            if (-not $process.WaitForExit(30000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "$Name startup did not exit cleanly within 30 seconds"
            }
            if ($process.ExitCode -ne 0) {
              throw "$Name startup exited with code $($process.ExitCode)"
            }
            if (-not (Test-Path $probe)) {
              throw "$Name startup did not create the READY marker"
            }

            $result = Get-Content $probe -Raw | ConvertFrom-Json
            if ($result.status -ne "ready") {
              throw "$Name startup marker did not report ready"
            }
            if ($result.application -ne "Banjofy Song Analysis Laboratory 007 — Meter, Bars and Downbeats") {
              throw "$Name startup marker came from the wrong build"
            }

            Write-Host "$Name positive startup handshake passed"
          }

          Invoke-StartupProof -Name "missing-settings" -SettingsMode "missing"
          Invoke-StartupProof -Name "valid-existing-settings" -SettingsMode "valid-existing"
          Invoke-StartupProof -Name "valid-unavailable-settings" -SettingsMode "valid-unavailable"
          Invoke-StartupProof -Name "malformed-settings" -SettingsMode "malformed"
          Invoke-StartupProof -Name "wrong-shape-settings" -SettingsMode "wrong-shape"

          Remove-Item Env:BANJOFY_STARTUP_PROBE_FILE -ErrorAction SilentlyContinue

      - name: Assemble exact artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifact" | Out-Null
          Copy-Item "laboratories/song_analysis_lab/dist/BanjofySongAnalysisLab007.exe" "artifact/" -Force
          Copy-Item "SONG_ANALYSIS_LAB_007_TEST.txt" "artifact/" -Force

          $expected = @(
            "artifact/BanjofySongAnalysisLab007.exe",
            "artifact/SONG_ANALYSIS_LAB_007_TEST.txt"
          )
          foreach ($file in $expected) {
            if (-not (Test-Path $file)) { throw "Assembled artifact missing: $file" }
          }
          $count = (Get-ChildItem artifact -File).Count
          if ($count -ne 2) { throw "Artifact contains $count files; expected exactly 2" }

          Get-FileHash "artifact/BanjofySongAnalysisLab007.exe" -Algorithm SHA256
          Get-FileHash "artifact/SONG_ANALYSIS_LAB_007_TEST.txt" -Algorithm SHA256

      - name: Upload audited Windows Laboratory 007
        uses: actions/upload-artifact@v4
        with:
          name: Banjofy-Song-Analysis-Laboratory-007-Windows
          path: artifact
          if-no-files-found: error
