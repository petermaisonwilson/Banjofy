name: Build Banjofy Song Analysis Laboratory 020

on:
  push:
    branches:
      - song-analysis-lab
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact Build 020 paths
        shell: pwsh
        run: |
          $required = @(
            ".github/workflows/song-analysis-lab.yml",
            "laboratories/song_analysis_lab/main.py",
            "laboratories/song_analysis_lab/structure_engine.py",
            "laboratories/song_analysis_lab/song_analysis_lab.spec",
            "laboratories/song_analysis_lab/release_gate.py",
            "laboratories/song_analysis_lab/requirements.txt",
            "SONG_ANALYSIS_LAB_020_TEST.txt"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing Build 020 file: $file" }
          }

      - name: Install pinned dependencies
        working-directory: laboratories/song_analysis_lab
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Pinned dependency installation failed" }

      - name: Run complete whole-track release gate
        working-directory: laboratories/song_analysis_lab
        run: |
          python release_gate.py
          if ($LASTEXITCODE -ne 0) { throw "Laboratory 020 release gate failed" }

      - name: Compile every Build 020 source
        working-directory: laboratories/song_analysis_lab
        run: |
          python -m py_compile main.py structure_engine.py release_gate.py
          if ($LASTEXITCODE -ne 0) { throw "Source compilation failed" }

      - name: Direct meter disagreement proof
        working-directory: laboratories/song_analysis_lab
        run: |
          python -c "import structure_engine as s; f=s.MeterCandidate('4/4',4,2,.3,.21); w=s.MeterCandidate('3/4',3,0,.4,.23); p,a=s.choose_primary_meter(f,w); assert p.meter=='4/4' and p.beats_per_bar==4 and p.phase==2 and not a; print('Whole-track primary disagreement proof passed')"

      - name: Build standalone Windows Laboratory 020
        working-directory: laboratories/song_analysis_lab
        run: |
          pyinstaller --clean --noconfirm song_analysis_lab.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          if (-not (Test-Path "dist/BanjofySongAnalysisLab020.exe")) { throw "Expected EXE missing" }

      - name: Finished EXE five positive startup handshakes
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE/laboratories/song_analysis_lab/dist/BanjofySongAnalysisLab020.exe"
          $settingsFolder = Join-Path $env:LOCALAPPDATA "Banjofy\SongAnalysisLab"
          $settingsFile = Join-Path $settingsFolder "song_analysis_lab_settings.json"
          $probeFolder = Join-Path $env:RUNNER_TEMP "banjofy-sal020-probes"
          $existingLibrary = Join-Path $env:RUNNER_TEMP "banjofy-existing-library"
          New-Item -ItemType Directory -Force $probeFolder | Out-Null
          New-Item -ItemType Directory -Force $existingLibrary | Out-Null

          function Invoke-Proof {
            param([string]$Name, [string]$Mode)
            Remove-Item $settingsFolder -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $settingsFolder | Out-Null
            if ($Mode -eq "existing") {
              @{ library_root = $existingLibrary } | ConvertTo-Json -Compress | Set-Content $settingsFile -Encoding UTF8
            } elseif ($Mode -eq "unavailable") {
              @{ library_root = "C:\Unavailable Banjofy Library" } | ConvertTo-Json -Compress | Set-Content $settingsFile -Encoding UTF8
            } elseif ($Mode -eq "malformed") {
              "{broken" | Set-Content $settingsFile -Encoding UTF8
            } elseif ($Mode -eq "wrong") {
              '["wrong"]' | Set-Content $settingsFile -Encoding UTF8
            }
            $probe = Join-Path $probeFolder "$Name.json"
            $env:BANJOFY_STARTUP_PROBE_FILE = $probe
            $process = Start-Process $exe -PassThru
            if (-not $process.WaitForExit(30000)) { throw "$Name timed out" }
            if ($process.ExitCode -ne 0) { throw "$Name exited $($process.ExitCode)" }
            if (-not (Test-Path $probe)) { throw "$Name READY marker missing" }
            $ready = Get-Content $probe -Raw | ConvertFrom-Json
            if ($ready.status -ne "ready") { throw "$Name did not report ready" }
          }

          Invoke-Proof "missing" "missing"
          Invoke-Proof "existing" "existing"
          Invoke-Proof "unavailable" "unavailable"
          Invoke-Proof "malformed" "malformed"
          Invoke-Proof "wrong-shape" "wrong"

      - name: Assemble exact two-file artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item "laboratories/song_analysis_lab/dist/BanjofySongAnalysisLab020.exe" artifact/
          Copy-Item "SONG_ANALYSIS_LAB_020_TEST.txt" artifact/
          if ((Get-ChildItem artifact -File).Count -ne 2) { throw "Wrong artifact contents" }

      - name: Upload audited Windows Laboratory 020
        uses: actions/upload-artifact@v4
        with:
          name: Banjofy-Song-Analysis-Laboratory-020-Windows
          path: artifact
          if-no-files-found: error
