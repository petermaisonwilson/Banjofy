name: Build Banjofy Song Analysis Laboratory 002

on:
  push:
    branches:
      - song-analysis-lab
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout song analysis branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact Laboratory 002 files
        shell: pwsh
        run: |
          $required = @(
            "laboratories/song_analysis_lab/main.py",
            "laboratories/song_analysis_lab/structure_engine.py",
            "laboratories/song_analysis_lab/song_analysis_lab.spec",
            "laboratories/song_analysis_lab/release_gate.py",
            "laboratories/song_analysis_lab/requirements.txt"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing Laboratory 002 file: $file" }
          }

      - name: Install pinned structure-analysis dependencies
        working-directory: laboratories/song_analysis_lab
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Pinned dependency installation failed" }

      - name: Run exact release gate
        working-directory: laboratories/song_analysis_lab
        run: |
          python release_gate.py
          if ($LASTEXITCODE -ne 0) { throw "Laboratory 002 release gate failed" }

      - name: Compile all Laboratory 002 sources
        working-directory: laboratories/song_analysis_lab
        run: |
          python -m py_compile main.py structure_engine.py release_gate.py
          if ($LASTEXITCODE -ne 0) { throw "Source compilation failed" }

      - name: Direct synthetic audio structure proof
        shell: pwsh
        working-directory: laboratories/song_analysis_lab
        run: |
          @'
          import math, tempfile
          from pathlib import Path
          import numpy as np
          import soundfile as sf
          import structure_engine

          sr = 22050
          duration = 24.0
          samples = np.zeros(int(sr * duration), dtype=np.float32)
          beat_interval = 0.5
          for beat in range(int(duration / beat_interval)):
              start = int(beat * beat_interval * sr)
              length = int(0.05 * sr)
              amplitude = 1.0 if beat % 4 == 1 else 0.35
              click = amplitude * np.hanning(length).astype(np.float32)
              samples[start:start + length] += click

          with tempfile.TemporaryDirectory() as temporary:
              audio = Path(temporary) / "four_four.wav"
              sf.write(audio, samples, sr)
              result = structure_engine.analyse_structure(
                  audio,
                  [{"start_s": 0.0, "end_s": duration, "chord": "G"}],
                  print,
              )
              assert result.meter == "4/4", result
              assert result.bar_count >= 8
              assert len(result.downbeat_times) == result.bar_count
              assert result.bar_aligned_chords
              print("Direct synthetic 4/4 structure proof passed")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Direct synthetic structure proof failed" }

      - name: Verify bundled FFmpeg
        working-directory: laboratories/song_analysis_lab
        run: |
          python -c "import imageio_ffmpeg, os; p=imageio_ffmpeg.get_ffmpeg_exe(); assert os.path.exists(p); print('FFmpeg available:', p)"

      - name: Build standalone Windows Laboratory 002
        working-directory: laboratories/song_analysis_lab
        run: |
          pyinstaller --clean --noconfirm song_analysis_lab.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          if (-not (Test-Path "dist/BanjofySongAnalysisLab002.exe")) { throw "Expected EXE was not produced" }

      - name: Startup smoke test
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE/laboratories/song_analysis_lab/dist/BanjofySongAnalysisLab002.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) { throw "Laboratory exited during startup smoke test with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
          Write-Host "Laboratory 002 startup smoke test passed"

      - name: Assemble artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifact" | Out-Null
          Copy-Item "laboratories/song_analysis_lab/dist/BanjofySongAnalysisLab002.exe" "artifact/" -Force
          Copy-Item "SONG_ANALYSIS_LAB_002_TEST.txt" "artifact/" -Force
          if (-not (Test-Path "artifact/BanjofySongAnalysisLab002.exe")) { throw "Assembled EXE missing" }

      - name: Upload Windows Laboratory 002
        uses: actions/upload-artifact@v4
        with:
          name: Banjofy-Song-Analysis-Laboratory-002-Windows
          path: artifact
          if-no-files-found: error
