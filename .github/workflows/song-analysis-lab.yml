name: Build Banjofy Song Analysis Laboratory 010

on:
  push:
    branches: [song-analysis-lab]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        working-directory: laboratories/song_analysis_lab
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt
      - name: Run complete release gate
        working-directory: laboratories/song_analysis_lab
        run: python release_gate.py
      - name: Compile sources
        working-directory: laboratories/song_analysis_lab
        run: python -m py_compile main.py structure_engine.py release_gate.py
      - name: Build standalone Windows Laboratory 010
        working-directory: laboratories/song_analysis_lab
        run: |
          pyinstaller --clean --noconfirm song_analysis_lab.spec
          if (-not (Test-Path "dist/BanjofySongAnalysisLab010.exe")) { throw "Expected EXE missing" }
      - name: Finished EXE positive startup handshake
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "sal010-ready.json"
          $env:BANJOFY_STARTUP_PROBE_FILE = $probe
          $exe = "$env:GITHUB_WORKSPACE/laboratories/song_analysis_lab/dist/BanjofySongAnalysisLab010.exe"
          $p = Start-Process $exe -PassThru
          if (-not $p.WaitForExit(30000)) { throw "Startup timed out" }
          if ($p.ExitCode -ne 0) { throw "Startup failed" }
          if (-not (Test-Path $probe)) { throw "READY marker missing" }
      - name: Assemble exact artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item "laboratories/song_analysis_lab/dist/BanjofySongAnalysisLab010.exe" artifact/
          Copy-Item "SONG_ANALYSIS_LAB_010_TEST.txt" artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: Banjofy-Song-Analysis-Laboratory-010-Windows
          path: artifact
          if-no-files-found: error
