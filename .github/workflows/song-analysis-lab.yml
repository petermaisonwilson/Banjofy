name: Build Banjofy BeatNet 008

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install complete BeatNet runtime dependency set
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install setuptools==80.9.0 wheel==0.45.1
          python -m pip install numpy==1.23.5 scipy==1.10.1 Cython==0.29.36 mido==1.3.2
          python -m pip install madmom==0.16.1 --no-build-isolation
          python -c "import madmom; from madmom.features.beats import RNNBeatProcessor; print('madmom import passed')"
          python -m pip install librosa==0.10.1 soundfile==0.12.1 audioread==3.0.1
          python -m pip install pyaudio==0.2.14
          python -c "import pyaudio; print('PyAudio import passed')"
          python -m pip install torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install matplotlib==3.7.5 tensorboard==2.15.2 PyYAML==6.0.2 pytest==8.3.5
          python -m pip install "git+https://github.com/mjhydri/BeatNet.git" --no-deps
          python -c "from BeatNet.BeatNet import BeatNet; print('BeatNet import passed')"

      - name: Run real madmom and BeatNet offline audio proof
        shell: pwsh
        run: |
          python laboratories/beatnet_lab/offline_smoke_test.py
          if ($LASTEXITCODE -ne 0) { throw "Real BeatNet audio proof failed" }

      - name: Run source release gate
        shell: pwsh
        run: |
          python laboratories/beatnet_lab/release_gate.py
          if ($LASTEXITCODE -ne 0) { throw "Source release gate failed" }

      - name: Install packaging tools
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.11.1 imageio-ffmpeg==0.4.9
          python -c "import imageio_ffmpeg; print('imageio-ffmpeg import passed:', imageio_ffmpeg.get_ffmpeg_exe())"
          choco install ffmpeg -y --no-progress

      - name: Full clean rebuild preparation
        shell: pwsh
        run: |
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item artifact -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path laboratories/beatnet_lab -Directory -Recurse -Filter __pycache__ -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          if (Test-Path build) { throw "build directory survived clean" }
          if (Test-Path dist) { throw "dist directory survived clean" }
          if (Test-Path artifact) { throw "artifact directory survived clean" }
          Write-Host "Clean rebuild preparation passed"

      - name: Build Windows application
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm laboratories/beatnet_lab/beatnet_lab.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          if (-not (Test-Path "dist/BN008/BN008.exe")) { throw "BN008.exe missing after PyInstaller" }
          if (-not (Test-Path "dist/BN008/BN8D.exe")) { throw "BN8D.exe diagnostic twin missing after PyInstaller" }

      - name: Audit compiled package contents
        shell: pwsh
        run: |
          $root = Resolve-Path "dist/BN008"

          $npCore = Get-ChildItem $root -Recurse -File -Filter "_multiarray_umath*.pyd"
          if (-not $npCore) { throw "NumPy _multiarray_umath compiled extension missing" }

          $npDll = Get-ChildItem $root -Recurse -File -Filter "*.dll" | Where-Object {
            $_.FullName -match '[\\/]numpy\.libs[\\/]' -or $_.FullName -match '[\\/]numpy[\\/]\.libs[\\/]'
          }
          if (-not $npDll) { throw "NumPy wheel DLLs missing from packaged application" }

          $spDll = Get-ChildItem $root -Recurse -File -Filter "*.dll" | Where-Object {
            $_.FullName -match '[\\/]scipy\.libs[\\/]' -or $_.FullName -match '[\\/]scipy[\\/]\.libs[\\/]'
          }
          if (-not $spDll) { throw "SciPy wheel DLLs missing from packaged application" }

          $mmPyd = Get-ChildItem $root -Recurse -File -Filter "*.pyd" | Where-Object { $_.FullName -match '[\\/]madmom[\\/]' }
          if (-not $mmPyd) { throw "madmom compiled extension modules missing from packaged application" }

          $mmMeta = Get-ChildItem $root -Recurse -Directory -Filter "madmom-*.dist-info"
          if (-not $mmMeta) { throw "madmom distribution metadata missing from packaged application" }

          Write-Host "NumPy core: $($npCore.Count) file(s)"
          Write-Host "NumPy DLLs: $($npDll.Count) file(s)"
          Write-Host "SciPy DLLs: $($spDll.Count) file(s)"
          Write-Host "madmom PYDs: $($mmPyd.Count) file(s)"
          Write-Host "madmom metadata: $($mmMeta.Count) folder(s)"
          Write-Host "Compiled package audit passed"

      - name: Diagnose packaged runtime with console twin
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/BN008/BN8D.exe"
          $probe = Join-Path $env:RUNNER_TEMP "bn008-diag.json"
          $stdout = Join-Path $env:RUNNER_TEMP "bn008-diag-out.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "bn008-diag-err.txt"
          Remove-Item $probe,$stdout,$stderr -Force -ErrorAction SilentlyContinue
          $env:BANJOFY_BEATNET_STARTUP_PROBE_FILE = $probe

          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $ready = $false
          $lastStage = "no stage written"

          for ($i = 0; $i -lt 120; $i++) {
            if (Test-Path $probe) {
              try {
                $payload = Get-Content $probe -Raw | ConvertFrom-Json
                if ($payload.stage -and $payload.stage -ne $lastStage) {
                  $lastStage = $payload.stage
                  Write-Host "Packaged startup stage: $lastStage"
                }
                if ($payload.status -eq "ready") {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if ($proc.HasExited) { break }
            Start-Sleep -Seconds 1
          }

          if (-not $ready) {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Write-Host "===== BN8D stdout ====="
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host "===== BN8D stderr ====="
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "BN8D.exe failed packaged runtime at stage '$lastStage'"
          }

          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          Remove-Item Env:BANJOFY_BEATNET_STARTUP_PROBE_FILE -ErrorAction SilentlyContinue
          Write-Host "Console diagnostic runtime proof passed"

      - name: Launch actual packaged EXE and require ready proof
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/BN008/BN008.exe"
          $probe = Join-Path $env:RUNNER_TEMP "bn008-ready.json"
          Remove-Item $probe -Force -ErrorAction SilentlyContinue
          $env:BANJOFY_BEATNET_STARTUP_PROBE_FILE = $probe

          $proc = Start-Process -FilePath $exe -PassThru
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            if (Test-Path $probe) {
              try {
                $payload = Get-Content $probe -Raw | ConvertFrom-Json
                if ($payload.status -eq "ready" -and $payload.stage -eq "complete") {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if ($proc.HasExited) { throw "BN008.exe exited before ready proof; exit code $($proc.ExitCode)" }
            Start-Sleep -Seconds 1
          }

          if (-not $ready) {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            throw "BN008.exe did not write ready proof after diagnostic twin passed"
          }

          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          Remove-Item Env:BANJOFY_BEATNET_STARTUP_PROBE_FILE -ErrorAction SilentlyContinue
          Write-Host "Packaged EXE ready proof passed: $($payload.app)"

      - name: Assemble artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Recurse -Force "dist/BN008" "artifact/BN008"
          Remove-Item "artifact/BN008/BN8D.exe" -Force -ErrorAction SilentlyContinue
          Copy-Item -Force "B008.txt" "artifact/B008.txt"
          Copy-Item -Force "laboratories/beatnet_lab/beatnet_offline_smoke_test.json" "artifact/beatnet_offline_smoke_test.json"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BN008-Win
          path: artifact
          if-no-files-found: error
