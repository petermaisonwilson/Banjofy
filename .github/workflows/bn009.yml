name: Build BN Con Lab009

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install BeatNet runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install setuptools==80.9.0 wheel==0.45.1
          python -m pip install numpy==1.23.5 scipy==1.10.1 Cython==0.29.36 mido==1.3.2
          python -m pip install madmom==0.16.1 --no-build-isolation
          python -m pip install librosa==0.10.1 soundfile==0.12.1 audioread==3.0.1
          python -m pip install pyaudio==0.2.14
          python -m pip install torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install matplotlib==3.7.5 PyYAML==6.0.2
          python -m pip install "git+https://github.com/mjhydri/BeatNet.git" --no-deps

      - name: Run BN009 consensus self test
        shell: pwsh
        run: |
          python laboratories/BN009/self_test.py
          if ($LASTEXITCODE -ne 0) { throw "BN009 consensus self test failed" }

      - name: Run proven BeatNet offline proof
        shell: pwsh
        run: |
          python laboratories/beatnet_lab/offline_smoke_test.py
          if ($LASTEXITCODE -ne 0) { throw "BeatNet offline proof failed" }

      - name: Run BN009 release gate
        shell: pwsh
        run: |
          python laboratories/BN009/release_gate.py
          if ($LASTEXITCODE -ne 0) { throw "BN009 release gate failed" }

      - name: Install packaging tools
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.11.1 imageio-ffmpeg==0.4.9

      - name: Full clean rebuild preparation
        shell: pwsh
        run: |
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item artifact -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path laboratories/BN009 -Directory -Recurse -Filter __pycache__ -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          if (Test-Path build) { throw "build directory survived clean" }
          if (Test-Path dist) { throw "dist directory survived clean" }
          if (Test-Path artifact) { throw "artifact directory survived clean" }
          Write-Host "Clean rebuild preparation passed"

      - name: Build BN009 Windows application
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm laboratories/BN009/BN009.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          if (-not (Test-Path "dist/BN009/BN009.exe")) { throw "BN009.exe missing" }
          if (-not (Test-Path "dist/BN009/BN9D.exe")) { throw "BN9D.exe missing" }

      - name: Audit uploaded package inputs
        shell: pwsh
        run: |
          $root = Resolve-Path "dist/BN009"
          $npCore = Get-ChildItem $root -Recurse -File -Filter "_multiarray_umath*.pyd"
          if (-not $npCore) { throw "NumPy core extension missing" }
          $npDll = Get-ChildItem $root -Recurse -File -Filter "*.dll" | Where-Object { $_.FullName -match '[\\/]numpy\.libs[\\/]' }
          if (-not $npDll) { throw "Visible NumPy DLL folder missing" }
          $spDll = Get-ChildItem $root -Recurse -File -Filter "*.dll" | Where-Object { $_.FullName -match '[\\/]scipy\.libs[\\/]' }
          if (-not $spDll) { throw "Visible SciPy DLL folder missing" }
          $mmMeta = Get-ChildItem $root -Recurse -Directory -Filter "madmom-*.dist-info"
          if (-not $mmMeta) { throw "madmom metadata missing" }
          Write-Host "Package input audit passed"

      - name: Launch console diagnostic
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/BN009/BN9D.exe"
          $probe = Join-Path $env:RUNNER_TEMP "bn009-diag.json"
          $stdout = Join-Path $env:RUNNER_TEMP "bn009-out.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "bn009-err.txt"
          Remove-Item $probe,$stdout,$stderr -Force -ErrorAction SilentlyContinue
          $env:BANJOFY_BEATNET_STARTUP_PROBE_FILE = $probe
          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          for ($i = 0; $i -lt 30; $i++) {
            if (Test-Path $probe) { break }
            if ($proc.HasExited) { break }
            Start-Sleep -Seconds 1
          }
          if (-not (Test-Path $probe)) {
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "BN9D.exe did not reach ready state"
          }
          $payload = Get-Content $probe -Raw | ConvertFrom-Json
          if ($payload.status -ne "ready") { throw "BN9D ready proof invalid" }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          Remove-Item Env:BANJOFY_BEATNET_STARTUP_PROBE_FILE -ErrorAction SilentlyContinue

      - name: Launch actual BN009 EXE
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/BN009/BN009.exe"
          $probe = Join-Path $env:RUNNER_TEMP "bn009-ready.json"
          Remove-Item $probe -Force -ErrorAction SilentlyContinue
          $env:BANJOFY_BEATNET_STARTUP_PROBE_FILE = $probe
          $proc = Start-Process -FilePath $exe -PassThru
          for ($i = 0; $i -lt 30; $i++) {
            if (Test-Path $probe) { break }
            if ($proc.HasExited -and $proc.ExitCode -ne 0) { throw "BN009.exe exited with code $($proc.ExitCode)" }
            Start-Sleep -Seconds 1
          }
          if (-not (Test-Path $probe)) { throw "BN009.exe did not reach ready state" }
          $payload = Get-Content $probe -Raw | ConvertFrom-Json
          if ($payload.status -ne "ready") { throw "BN009 ready proof invalid" }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          Remove-Item Env:BANJOFY_BEATNET_STARTUP_PROBE_FILE -ErrorAction SilentlyContinue

      - name: Assemble artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Recurse -Force "dist/BN009" "artifact/BN009"
          Remove-Item "artifact/BN009/BN9D.exe" -Force -ErrorAction SilentlyContinue

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BN009-Win
          path: artifact
          if-no-files-found: error
          include-hidden-files: true
